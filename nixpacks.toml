[packages]
apt = ["ffmpeg"]

[variables]
PLAYWRIGHT_BROWSERS_PATH = "/app/.playwright"

[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = ["pip install -r requirements.txt", "mkdir -p /app/.playwright", "python -m playwright install chromium"]

[phases.build]
cmds = ["python -m compileall -q ."]

[start]
cmd = "bash start.sh"
