[packages]
apt = [
  "ffmpeg",
  "chromium",
  "libnss3",
  "libnspr4",
  "libgbm1",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libasound2",
  "libpangocairo-1.0-0",
  "libxss1",
  "libgtk-3-0",
  "libxshmfence1",
  "libglu1"
]

[variables]
PLAYWRIGHT_BROWSERS_PATH = "/app/.playwright"

[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "mkdir -p /app/.playwright",
  "PLAYWRIGHT_BROWSERS_PATH=/app/.playwright python -m playwright install chromium",
  "python -c \"import shutil; print('SYSTEM_CHROMIUM='+str(shutil.which('chromium') or shutil.which('chromium-browser') or 'NOT_FOUND')); assert shutil.which('chromium') or shutil.which('chromium-browser'), 'System Chromium was not installed'\""
]

[phases.build]
cmds = ["python -m compileall -q ."]

[start]
cmd = "bash start.sh"
