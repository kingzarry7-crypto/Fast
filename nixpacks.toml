[packages]
apt = ["ffmpeg", "chromium"]

[variables]
PLAYWRIGHT_BROWSERS_PATH = "0"

[phases.setup]
nixPkgs = ["python312", "chromium"]

[phases.install]
cmds = ["pip install -r requirements.txt", "python -m playwright install chromium"]

[phases.build]
cmds = ["python -m compileall -q ."]

[start]
cmd = "bash start.sh"
