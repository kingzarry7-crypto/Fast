[packages]
apt = ["ffmpeg"]

[variables]
PLAYWRIGHT_BROWSERS_PATH = "/app/.playwright"

[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "mkdir -p /app/.playwright",
  "PLAYWRIGHT_BROWSERS_PATH=/app/.playwright python -m playwright install chromium",
  "PLAYWRIGHT_BROWSERS_PATH=/app/.playwright python -c \"from playwright.sync_api import sync_playwright; from pathlib import Path; p=sync_playwright().start(); exe=Path(p.chromium.executable_path); print('PLAYWRIGHT_BUILD_CHROMIUM='+str(exe)); print('PLAYWRIGHT_BUILD_CHROMIUM_EXISTS='+str(exe.exists())); assert exe.exists(), 'Playwright Chromium was not installed'; p.stop()\""
]

[phases.build]
cmds = ["python -m compileall -q ."]

[start]
cmd = "bash start.sh"
