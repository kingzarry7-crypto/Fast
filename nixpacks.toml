[phases.setup]
aptPkgs = [
  "ffmpeg",
  "chromium",
  "libnss3",
  "libnspr4",
  "libgbm1",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libasound2",
  "libpangocairo-1.0-0",
  "libxss1",
  "libgtk-3-0",
  "libxshmfence1",
  "libglu1"
]
nixPkgs = ["python312"]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "mkdir -p /app/.playwright",
  "PLAYWRIGHT_BROWSERS_PATH=/app/.playwright python -m playwright install chromium",
  "echo '=== BROWSER BUILD CHECK ==='",
  "command -v chromium || command -v chromium-browser || true",
  "ls -l /usr/bin/chromium /usr/bin/chromium-browser 2>/dev/null || true",
  "python -c "import shutil; p=shutil.which('chromium') or shutil.which('chromium-browser'); print('SYSTEM_CHROMIUM='+str(p or 'NOT_FOUND')); assert p, 'System Chromium was not installed'""
]

[phases.build]
cmds = ["python -m compileall -q ."]

[start]
cmd = "bash start.sh"
