name: ZARRY model benchmark
on:
  pull_request:
    paths:
      - "research-data/zarry-model/**"
      - "research-data/scripts/zarry_model_benchmark.py"
      - "research-data/scripts/zarry_real_model_api_benchmark.py"
      - "tests/test_zarry_model_benchmark.py"
      - "tests/test_zarry_real_model_api_benchmark.py"
      - ".github/workflows/zarry-model-benchmark.yml"
  workflow_dispatch:
    inputs:
      models:
        description: "Models to benchmark (space-separated)"
        required: true
        default: "qwen3-1.7b"
        type: string
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p 'test_zarry_model_benchmark.py' -v
      - run: python -m unittest discover -s tests -p 'test_zarry_real_model_api_benchmark.py' -v
  model-inference:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU inference runtime
        run: |
          python -m pip install --upgrade pip
          CMAKE_ARGS="-DGGML_NATIVE=OFF" python -m pip install "llama-cpp-python==0.3.16" "huggingface_hub>=0.30,<2" "fastapi==0.142.4" "pydantic==2.12.5" httpx
      - name: Run direct structured-output stress benchmark
        run: |
          python research-data/scripts/zarry_model_benchmark.py --models ${{ inputs.models }} --threads 2 --output research-data/reports/zarry-model-benchmark-run-${{ github.run_id }}.json
      - name: Run production API-path Qwen3 smoke benchmark
        run: |
          python research-data/scripts/zarry_real_model_api_benchmark.py --model-repo unsloth/Qwen3-1.7B-GGUF --threads 2 --output research-data/reports/zarry-api-model-benchmark-run-${{ github.run_id }}.json
      - uses: actions/upload-artifact@v6
        with:
          name: zarry-model-benchmark-${{ github.run_id }}
          path: |
            research-data/reports/zarry-model-benchmark-run-${{ github.run_id }}.json
            research-data/reports/zarry-api-model-benchmark-run-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 90
