name: Fast V5 Safety Checks

on:
  push:
    branches: ["main", "v5-safe-foundation"]
  pull_request:
    branches: ["main"]

jobs:
  frontend:
    name: Frontend build + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: npm install
      - name: Lint frontend
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Next.js production build
        run: npm run build
      - name: Cloudflare OpenNext build
        run: npm run cf:build

  backend:
    name: Python syntax safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: |
          python -m compileall -q .
      - name: Test Kitty candle feature extraction
        run: python -m unittest discover -s tests -p "test_kitty_features.py" -v
      - name: Install backend test dependencies
        run: python -m pip install "openai==1.54.4" "fastapi==0.142.4" "requests==2.33.0"
      - name: Test Coding Agent routing and provider configuration
        run: python -m unittest test_coding_request test_llm_client test_fal_media_adapter test_alpaca_bars_window test_twelvedata_calendar_routing test_calendar_live_health_status -v
      - name: Test Zarry streaming project context
        run: python -m unittest test_streaming_chat_context -v
      - name: Test Kitty demo trading persistence and safety
        run: python -m unittest discover -s tests -p "test_kitty_demo_trader.py" -v
      - name: Test free news and empty market-data fallbacks
        run: |
          python -m unittest discover -s tests -p "test_free_news_fallback.py" -v
          python -m unittest discover -s tests -p "test_market_empty_fallback.py" -v
