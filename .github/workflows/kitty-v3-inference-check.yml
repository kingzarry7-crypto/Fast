name: Kitty V3 legacy inference contract

on:
  push:
    branches: ["**"]
    paths:
      - "kitty_v3.py"
      - "kitty_v3_assets/**"
      - "tests/test_kitty_v3.py"
      - ".github/workflows/kitty-v3-inference-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "kitty_v3.py"
      - "kitty_v3_assets/**"
      - "tests/test_kitty_v3.py"
      - ".github/workflows/kitty-v3-inference-check.yml"
  workflow_dispatch:

jobs:
  kitty-v3-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install small Python dependencies
        run: python -m pip install --upgrade pip numpy==2.0.2 joblib==1.4.2 scikit-learn==1.6.1
      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Load actual packaged weights and run inference contract tests
        run: python -m unittest discover -s tests -p 'test_kitty_v3.py' -v
