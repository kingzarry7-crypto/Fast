name: Fast Security Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Use the repository-pinned npm version
        run: npm install --global npm@10.9.2
      - name: Prepare runtime-only dependency manifest
        working-directory: frontend
        run: |
          node -e 'const fs=require("node:fs"); const p=require("./package.json"); fs.mkdirSync(".audit-runtime",{recursive:true}); fs.writeFileSync(".audit-runtime/package.json", JSON.stringify({name:p.name,version:p.version,private:true,dependencies:p.dependencies,overrides:p.overrides},null,2));'
      - name: Generate runtime lockfile for audit
        working-directory: frontend/.audit-runtime
        run: |
          npm --version
          npm cache clean --force
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Audit runtime frontend dependencies
        working-directory: frontend/.audit-runtime
        run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r requirements.txt

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
