name: Regenerate frontend lockfile (temporary repair)
on:
  push:
    branches:
      - fix/frontend-next-security-lockfile
permissions:
  contents: write
concurrency:
  group: frontend-lockfile-repair
  cancel-in-progress: false
jobs:
  lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/frontend-next-security-lockfile
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin npm version
        run: npm install --global npm@10.9.2
      - name: Regenerate lockfile from patched package versions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit verified lockfile metadata
        working-directory: .
        run: |
          git diff --check
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: synchronize patched frontend dependency lockfile"
          git push origin HEAD:fix/frontend-next-security-lockfile
