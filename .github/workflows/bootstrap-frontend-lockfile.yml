name: Bootstrap frontend lockfile

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-frontend-lockfile.yml"

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check whether lockfile already exists
        id: lockfile
        run: |
          if [ -s frontend/package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Use the repository-pinned npm version
        if: steps.lockfile.outputs.exists == 'false'
        run: npm install --global npm@10.9.2
      - name: Generate lockfile without running package scripts
        if: steps.lockfile.outputs.exists == 'false'
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Commit generated lockfile once
        if: steps.lockfile.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s frontend/package-lock.json ]; then
            echo "npm did not generate a lockfile" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit"
          else
            git commit -m "chore(frontend): add reproducible npm lockfile"
            git push origin HEAD:main
          fi
