name: Kitty V3 retrained checkpoint contract

on:
  pull_request:
    branches: [main]
    paths:
      - "kitty_v3_retrained_checkpoint.pt"
      - "kitty_v3_retrained.py"
      - "tests/test_kitty_v3_retrained.py"
      - "tests/test_kitty_candle_feature_contract.py"
      - "kitty_api.py"
      - "prepare_kitty_market_dataset.py"
      - "prepare_kitty_fx_market_dataset.py"
      - "train_kitty_v3_retrained.py"
      - "kitty_paper_trader.py"
      - "tests/test_prepare_kitty_market_dataset.py"
      - "tests/test_prepare_kitty_fx_market_dataset.py"
      - "tests/test_train_kitty_v3_retrained.py"
      - "tests/test_kitty_paper_trader.py"
      - ".github/workflows/kitty-v3-retrained-check.yml"
  push:
    branches: [main, "kingzarry7-crypto-patch-6"]

jobs:
  validate-retrained-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install model dependencies
        run: python -m pip install --upgrade pip torch scikit-learn numpy pandas fastapi pydantic requests
      - name: Load real checkpoint and run contract tests
        run: |
          python -m unittest discover -s tests -p 'test_kitty_v3_retrained.py' -v
          python -m unittest discover -s tests -p 'test_kitty_candle_feature_contract.py' -v
          python -m unittest discover -s tests -p 'test_prepare_kitty_market_dataset.py' -v
          python -m unittest discover -s tests -p 'test_prepare_kitty_fx_market_dataset.py' -v
          python -m unittest discover -s tests -p 'test_train_kitty_v3_retrained.py' -v
          python -m unittest discover -s tests -p 'test_kitty_paper_trader.py' -v
