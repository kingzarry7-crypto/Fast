name: ZARRY inference service contract

on:
  pull_request:
    paths:
      - "zarry-service/**"
      - ".github/workflows/zarry-service-contract.yml"
  push:
    branches: ["main"]
    paths:
      - "zarry-service/**"
      - ".github/workflows/zarry-service-contract.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install lightweight service test dependencies
        run: python -m pip install "fastapi==0.142.4" "pydantic==2.12.5" "httpx"
      - name: Compile service
        run: python -m compileall -q zarry-service
      - name: Run service contract tests
        run: python -m unittest discover -s zarry-service/tests -p "test_*.py" -v
