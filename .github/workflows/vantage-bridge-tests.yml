name: Vantage MT5 bridge tests

on:
  push:
    branches: ["feature/vantage-mt5-kitty-bridge"]
  pull_request:
    branches: ["main"]

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model test dependencies
        run: python -m pip install --upgrade pip numpy torch scikit-learn
      - name: Run bridge safety tests
        run: python -m unittest discover -s tests -p 'test_vantage_mt5_bridge.py' -v
      - name: Run Kitty inference safety tests
        run: python -m unittest discover -s tests -p 'test_kitty_v3_retrained.py' -v
