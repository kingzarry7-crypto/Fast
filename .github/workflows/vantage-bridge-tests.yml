name: Vantage MT5 bridge tests

on:
  push:
    branches: ["feature/vantage-mt5-kitty-bridge"]
  pull_request:
    branches: ["main"]

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bridge safety tests
        run: python -m unittest tests.test_vantage_mt5_bridge -v
