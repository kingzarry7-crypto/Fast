name: Kitty historical retraining (research only)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kitty-retrain-research.yml"
      - "prepare_kitty_fx_market_dataset.py"
      - "tests/test_prepare_kitty_fx_market_dataset.py"
      - "train_kitty_v3_retrained.py"
      - "prepare_kitty_market_dataset.py"
  workflow_dispatch:
    inputs:
      limit:
        description: Hourly candles per market (500-5000)
        required: true
        default: "15000"
        type: choice
        options: ["2000", "5000", "10000", "15000"]
      threshold:
        description: Six-hour move threshold for SHORT/LONG labels
        required: true
        default: "0.003"
        type: choice
        options: ["0.002", "0.003", "0.004", "0.005"]
  schedule:
    - cron: "17 2 * * 0"
permissions:
  contents: read

concurrency:
  group: kitty-retraining-research
  cancel-in-progress: false

jobs:
  retrain-market-research:
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTC, ETH, SOL, BNB]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install training dependencies
        run: python -m pip install --upgrade pip numpy pandas scikit-learn torch requests fastapi pydantic
      - name: Run gold and forex dataset builder tests
        run: python -m unittest discover -s tests -p 'test_prepare_kitty_fx_market_dataset.py' -v
      - name: Run crypto dataset builder tests
        run: python -m unittest discover -s tests -p 'test_prepare_kitty_market_dataset.py' -v
      - name: Run training contract and leakage tests
        run: python -m unittest discover -s tests -p 'test_train_kitty_v3_retrained.py' -v
      - name: Run paper-trader feedback and safety tests
        run: python -m unittest discover -s tests -p 'test_kitty_paper_trader.py' -v
      - name: Build hourly dataset from public historical candles
        env:
          LIMIT: ${{ github.event.inputs.limit || '15000' }}
          THRESHOLD: ${{ github.event.inputs.threshold || '0.003' }}
        run: |
          echo "MARKET_LABEL_THRESHOLD=$THRESHOLD" >> "$GITHUB_ENV"
          mkdir -p "kitty-training-output/${{ matrix.symbol }}"
          python prepare_kitty_market_dataset.py --symbol "${{ matrix.symbol }}" --limit "$LIMIT" --threshold "$THRESHOLD" --output "kitty-training-output/${{ matrix.symbol }}/hourly_features.csv"
      - name: Train candidate models and evaluate one holdout
        run: |
          python train_kitty_v3_retrained.py --symbol "${{ matrix.symbol }}" --csv "kitty-training-output/${{ matrix.symbol }}/hourly_features.csv" --output-dir "kitty-training-output/${{ matrix.symbol }}/candidates" --epochs 100 --patience 10 --batch-size 128 --purge 6 --round-trip-cost 0.001 --label-threshold "$MARKET_LABEL_THRESHOLD"
      - name: Publish research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kitty-${{ matrix.symbol }}-retraining-${{ github.run_number }}
          path: kitty-training-output/
          if-no-files-found: warn
          retention-days: 30

  retrain-gold-forex-research:
    strategy:
      fail-fast: false
      matrix:
        symbol: [XAUUSD, EURUSD, GBPUSD, USDJPY]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY || secrets.TWELVE_DATA_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install training dependencies
        run: python -m pip install --upgrade pip numpy pandas scikit-learn torch requests
      - name: Run gold and forex dataset tests
        run: python -m unittest discover -s tests -p 'test_prepare_kitty_fx_market_dataset.py' -v
      - name: Build hourly dataset from Twelve Data or free Yahoo Finance fallback
        env:
          LIMIT: ${{ github.event.inputs.limit || '15000' }}
          REQUESTED_THRESHOLD: ${{ github.event.inputs.threshold || '' }}
        run: |
          # A 0.30% six-hour target is too large for many FX moves and creates
          # a mostly-NO-TRADE dataset. Use market-specific targets by default.
          if [ -n "$REQUESTED_THRESHOLD" ] && [ "$REQUESTED_THRESHOLD" != "0.003" ]; then
            THRESHOLD="$REQUESTED_THRESHOLD"
          elif [ "${{ matrix.symbol }}" = "XAUUSD" ]; then
            THRESHOLD="0.0015"
          else
            THRESHOLD="0.0008"
          fi
          echo "Research label threshold for ${{ matrix.symbol }}: $THRESHOLD"
          echo "MARKET_LABEL_THRESHOLD=$THRESHOLD" >> "$GITHUB_ENV"
          mkdir -p "kitty-training-output/${{ matrix.symbol }}"
          python prepare_kitty_fx_market_dataset.py --symbol "${{ matrix.symbol }}" --limit "$LIMIT" --threshold "$THRESHOLD" --output "kitty-training-output/${{ matrix.symbol }}/hourly_features.csv"
      - name: Train isolated research candidate and holdout evaluation
        env:
          MARKET_SYMBOL: ${{ matrix.symbol }}
        run: |
          if [ "$MARKET_SYMBOL" = "XAUUSD" ]; then ROUND_TRIP_COST="0.0005"; else ROUND_TRIP_COST="0.0003"; fi
          echo "Assumed round-trip cost for $MARKET_SYMBOL: $ROUND_TRIP_COST"
          python train_kitty_v3_retrained.py --symbol "$MARKET_SYMBOL" --csv "kitty-training-output/$MARKET_SYMBOL/hourly_features.csv" --output-dir "kitty-training-output/$MARKET_SYMBOL/candidates" --epochs 100 --patience 10 --batch-size 128 --purge 6 --round-trip-cost "$ROUND_TRIP_COST" --label-threshold "$MARKET_LABEL_THRESHOLD"
      - name: Publish gold and forex research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kitty-${{ matrix.symbol }}-retraining-${{ github.run_number }}
          path: kitty-training-output/${{ matrix.symbol }}/
          if-no-files-found: ignore
          retention-days: 30