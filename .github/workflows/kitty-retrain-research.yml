name: Kitty historical retraining (research only)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kitty-retrain-research.yml"
      - "prepare_kitty_fx_market_dataset.py"
      - "tests/test_prepare_kitty_fx_market_dataset.py"
      - "tests/test_kitty_gold_prediction.py"
      - "train_kitty_v3_retrained.py"
      - "prepare_kitty_market_dataset.py"
      - "tests/test_prepare_kitty_market_dataset.py"
      - "kitty_api.py"
      - "kitty_gold_model.py"
      - "kitty_features.py"
      - "kitty_v3_retrained.py"
  workflow_dispatch:
    inputs:
      limit:
        description: Hourly candles per market (500-15000)
        required: true
        default: "5000"
        type: choice
        options: ["2000", "5000", "10000", "15000"]
      threshold:
        description: Crypto six-hour move threshold for SHORT/LONG labels
        required: true
        default: "0.003"
        type: choice
        options: ["0.002", "0.003", "0.004", "0.005"]
  schedule:
    - cron: "17 2 * * 0"
# Publish only validated research checkpoints; never enable production signals or automatic orders.
permissions:
  contents: write

concurrency:
  group: kitty-retraining-research
  cancel-in-progress: false

jobs:
  retrain-market-research:
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTC, ETH, SOL, BNB]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install training dependencies
        run: python -m pip install --upgrade pip numpy pandas scikit-learn torch requests fastapi pydantic
      - name: Run gold and forex dataset builder tests
        run: python -m unittest discover -s tests -p 'test_prepare_kitty_fx_market_dataset.py' -v
      - name: Run Kitty gold/crypto timestamp regressions
        run: python -m unittest discover -s tests -p 'test_kitty_gold_prediction.py' -v
      - name: Run crypto dataset builder tests
        run: python -m unittest discover -s tests -p 'test_prepare_kitty_market_dataset.py' -v
      - name: Run training contract and leakage tests
        run: python -m unittest discover -s tests -p 'test_train_kitty_v3_retrained.py' -v
      - name: Run paper-trader feedback and safety tests
        run: python -m unittest discover -s tests -p 'test_kitty_paper_trader.py' -v
      - name: Build hourly dataset from public historical candles
        env:
          LIMIT: ${{ github.event.inputs.limit || '15000' }}
          THRESHOLD: ${{ github.event.inputs.threshold || '0.003' }}
        run: |
          echo "MARKET_LABEL_THRESHOLD=$THRESHOLD" >> "$GITHUB_ENV"
          mkdir -p "kitty-training-output/${{ matrix.symbol }}"
          python prepare_kitty_market_dataset.py --symbol "${{ matrix.symbol }}" --limit "$LIMIT" --threshold "$THRESHOLD" --output "kitty-training-output/${{ matrix.symbol }}/hourly_features.csv"
      - name: Train candidate models and evaluate one holdout
        run: |
          python train_kitty_v3_retrained.py --symbol "${{ matrix.symbol }}" --csv "kitty-training-output/${{ matrix.symbol }}/hourly_features.csv" --output-dir "kitty-training-output/${{ matrix.symbol }}/candidates" --epochs 100 --patience 10 --batch-size 128 --purge 7 --round-trip-cost 0.001 --label-threshold "$MARKET_LABEL_THRESHOLD"
      - name: Prepare BTC research checkpoint for runtime inference
        if: matrix.symbol == 'BTC'
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          import torch
          report = json.loads(Path("kitty-training-output/BTC/candidates/comparison_report.json").read_text())
          candidate = Path(report["selection"]["candidate"])
          if not candidate.is_file():
              candidate = Path("kitty-training-output/BTC/candidates") / candidate.name
          checkpoint = torch.load(candidate, map_location="cpu", weights_only=False)
          if checkpoint.get("training_symbol") != "BTC":
              raise SystemExit("Refusing to publish a non-BTC checkpoint")
          if checkpoint.get("production_ready") is not False or checkpoint.get("automatic_order_execution_enabled") is not False:
              raise SystemExit("Research checkpoint must remain unapproved with order execution disabled")
          if not isinstance(checkpoint.get("test_metrics"), dict):
              raise SystemExit("Checkpoint is missing untouched holdout metrics")
          destination = Path("research-model/kitty_BTC_checkpoint.pt")
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(candidate, destination)
          print({"symbol": "BTC", "checkpoint": str(destination), "research_only": True,
                 "signals_disabled_for_no_validated_edge": checkpoint["test_metrics"].get("signals_disabled_for_no_validated_edge")})
          PY
      - name: Upload BTC runtime research checkpoint
        if: matrix.symbol == 'BTC'
        uses: actions/upload-artifact@v6
        with:
          name: kitty-BTC-checkpoint-${{ github.run_number }}
          path: research-model/kitty_BTC_checkpoint.pt
          if-no-files-found: error
          retention-days: 7
      - name: Publish research artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kitty-${{ matrix.symbol }}-retraining-${{ github.run_number }}
          path: kitty-training-output/
          if-no-files-found: warn
          retention-days: 30

  retrain-gold-forex-research:
    environment: "my screty"
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol: [XAUUSD, EURUSD, GBPUSD, USDJPY]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY || secrets.TWELVE_DATA_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install training dependencies
        run: python -m pip install --upgrade pip numpy pandas scikit-learn torch requests
      - name: Run gold and forex dataset tests
        run: python -m unittest discover -s tests -p 'test_prepare_kitty_fx_market_dataset.py' -v
      - name: Run Kitty gold/crypto timestamp regressions
        run: python -m unittest discover -s tests -p 'test_kitty_gold_prediction.py' -v
      - name: Require Twelve Data credentials for real XAU/USD spot training
        if: matrix.symbol == 'XAUUSD'
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY || secrets.TWELVE_DATA_API_KEY }}
        run: |
          if [ -z "$TWELVEDATA_API_KEY" ]; then
            echo "::error::Gold training requires the TWELVEDATA_API_KEY or TWELVE_DATA_API_KEY GitHub Actions environment secret. Ensure it is set in the selected environment."
            exit 1
          fi
          echo "Twelve Data credential is present; its value will not be printed."
      - name: Build hourly dataset from Twelve Data or free Yahoo Finance fallback
        env:
          LIMIT: ${{ github.event.inputs.limit || '5000' }}
        run: |
          # A 0.30% six-hour target is too large for many FX moves and creates
          # a mostly-NO-TRADE dataset. Use market-specific targets by default.
          if [ "${{ matrix.symbol }}" = "XAUUSD" ]; then
            THRESHOLD="0.0015"
          else
            THRESHOLD="0.0008"
          fi
          echo "Research label threshold for ${{ matrix.symbol }}: $THRESHOLD"
          echo "MARKET_LABEL_THRESHOLD=$THRESHOLD" >> "$GITHUB_ENV"
          mkdir -p "kitty-training-output/${{ matrix.symbol }}"
          REQUIRE_SPOT=""
          if [ "${{ matrix.symbol }}" = "XAUUSD" ]; then REQUIRE_SPOT="--require-spot"; fi
          python prepare_kitty_fx_market_dataset.py --symbol "${{ matrix.symbol }}" --limit "$LIMIT" --threshold "$THRESHOLD" --output "kitty-training-output/${{ matrix.symbol }}/hourly_features.csv" $REQUIRE_SPOT
      - name: Verify Gold dataset is genuine Twelve Data XAU/USD spot
        if: matrix.symbol == 'XAUUSD'
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          path = Path("kitty-training-output/XAUUSD/hourly_features.csv")
          if not path.is_file():
              raise SystemExit("Gold dataset file was not created")
          frame = pd.read_csv(path)
          if len(frame) < 500:
              raise SystemExit(f"Gold dataset has only {len(frame)} rows; refusing to train")
          if "data_source" not in frame.columns:
              raise SystemExit("Gold dataset is missing data_source provenance")
          sources = sorted(frame["data_source"].dropna().astype(str).unique().tolist())
          if not sources or any(not source.startswith("Twelve Data XAU/USD") for source in sources):
              raise SystemExit(f"Gold dataset is not verified Twelve Data XAU/USD spot data: {sources}")
          if "timestamp" not in frame.columns or frame["timestamp"].isna().any():
              raise SystemExit("Gold dataset has missing timestamps")
          print({"symbol": "XAUUSD", "rows": len(frame), "sources": sources,
                 "first_timestamp": str(frame["timestamp"].iloc[0]),
                 "last_timestamp": str(frame["timestamp"].iloc[-1]),
                 "research_only": True})
          PY
      - name: Train isolated research candidate and holdout evaluation
        env:
          MARKET_SYMBOL: ${{ matrix.symbol }}
        run: |
          # All-in research assumptions include spread, commissions/fees and slippage.
          # These are not a substitute for measuring the current JustMarkets bid/ask spread.
          if [ "$MARKET_SYMBOL" = "XAUUSD" ]; then ROUND_TRIP_COST="0.0005"; else ROUND_TRIP_COST="0.0003"; fi
          echo "Assumed all-in round-trip spread+fees+slippage for $MARKET_SYMBOL: $ROUND_TRIP_COST (not broker-quote verified)"
          python train_kitty_v3_retrained.py --symbol "$MARKET_SYMBOL" --csv "kitty-training-output/$MARKET_SYMBOL/hourly_features.csv" --output-dir "kitty-training-output/$MARKET_SYMBOL/candidates" --epochs 100 --patience 10 --batch-size 128 --purge 7 --round-trip-cost "$ROUND_TRIP_COST" --label-threshold "$MARKET_LABEL_THRESHOLD"
      - name: Prepare XAUUSD research checkpoint for runtime inference
        if: matrix.symbol == 'XAUUSD'
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          import torch
          report = json.loads(Path("kitty-training-output/XAUUSD/candidates/comparison_report.json").read_text())
          candidate = Path(report["selection"]["candidate"])
          if not candidate.is_file():
              candidate = Path("kitty-training-output/XAUUSD/candidates") / candidate.name
          checkpoint = torch.load(candidate, map_location="cpu", weights_only=False)
          sources = checkpoint.get("training_data_sources")
          if checkpoint.get("training_symbol") != "XAUUSD":
              raise SystemExit("Refusing to publish a non-XAUUSD checkpoint")
          if not isinstance(sources, list) or not any(isinstance(s, str) and s.startswith("Twelve Data XAU/USD") for s in sources):
              raise SystemExit(f"Refusing to publish Gold checkpoint without verified XAU/USD spot provenance: {sources}")
          if checkpoint.get("production_ready") is not False or checkpoint.get("automatic_order_execution_enabled") is not False:
              raise SystemExit("Gold research checkpoint must remain unapproved with order execution disabled")
          if not isinstance(checkpoint.get("test_metrics"), dict):
              raise SystemExit("Gold checkpoint is missing untouched holdout metrics")
          destination = Path("research-model/kitty_XAUUSD_checkpoint.pt")
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(candidate, destination)
          print({"symbol": "XAUUSD", "checkpoint": str(destination), "sources": sources,
                 "research_only": True,
                 "signals_disabled_for_no_validated_edge": checkpoint["test_metrics"].get("signals_disabled_for_no_validated_edge")})
          PY
      - name: Upload XAUUSD runtime research checkpoint
        if: matrix.symbol == 'XAUUSD'
        uses: actions/upload-artifact@v6
        with:
          name: kitty-XAUUSD-checkpoint-${{ github.run_number }}
          path: research-model/kitty_XAUUSD_checkpoint.pt
          if-no-files-found: error
          retention-days: 7
      - name: Publish gold and forex research artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kitty-${{ matrix.symbol }}-retraining-${{ github.run_number }}
          path: kitty-training-output/${{ matrix.symbol }}/
          if-no-files-found: ignore
          retention-days: 30
  publish-runtime-research-checkpoints:
    name: Publish BTC and XAUUSD research checkpoints
    needs: [retrain-market-research, retrain-gold-forex-research]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python for checkpoint validation
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install checkpoint validation dependencies
        run: python -m pip install --upgrade pip numpy scikit-learn torch
      - name: Download BTC checkpoint
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: kitty-BTC-checkpoint-${{ github.run_number }}
          path: downloaded/btc
      - name: Download XAUUSD checkpoint
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: kitty-XAUUSD-checkpoint-${{ github.run_number }}
          path: downloaded/xauusd
      - name: Validate and publish research checkpoints to main
        run: |
          set -euo pipefail
          test -s downloaded/btc/kitty_BTC_checkpoint.pt
          test -s downloaded/xauusd/kitty_XAUUSD_checkpoint.pt
          mkdir -p models
          cp downloaded/btc/kitty_BTC_checkpoint.pt kitty_v3_retrained_checkpoint.pt
          cp downloaded/xauusd/kitty_XAUUSD_checkpoint.pt models/kitty_XAUUSD_checkpoint.pt
          python - <<'PY'
          import torch
          btc = torch.load("kitty_v3_retrained_checkpoint.pt", map_location="cpu", weights_only=False)
          gold = torch.load("models/kitty_XAUUSD_checkpoint.pt", map_location="cpu", weights_only=False)
          assert btc.get("training_symbol") == "BTC"
          assert btc.get("production_ready") is False
          assert btc.get("automatic_order_execution_enabled") is False
          assert isinstance(btc.get("test_metrics"), dict)
          assert gold.get("training_symbol") == "XAUUSD"
          assert gold.get("production_ready") is False
          assert gold.get("automatic_order_execution_enabled") is False
          assert isinstance(gold.get("test_metrics"), dict)
          sources = gold.get("training_data_sources")
          assert isinstance(sources, list) and any(isinstance(s, str) and s.startswith("Twelve Data XAU/USD") for s in sources)
          print({"BTC": "validated research checkpoint", "XAUUSD": "validated Twelve Data spot research checkpoint",
                 "production_ready": False, "automatic_order_execution_enabled": False})
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kitty_v3_retrained_checkpoint.pt models/kitty_XAUUSD_checkpoint.pt
          if git diff --cached --quiet; then
            echo "Research checkpoints unchanged; no commit needed."
            exit 0
          fi
          git commit -m "chore: publish BTC and XAUUSD research checkpoints"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
