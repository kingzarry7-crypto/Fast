name: Kitty V3 training experiment checks

on:
  push:
    branches: ["**"]
    paths:
      - "train_kitty_v3_retrained.py"
      - "tests/test_train_kitty_v3_retrained.py"
      - ".github/workflows/kitty-v3-training-experiments.yml"
  pull_request:
    paths:
      - "train_kitty_v3_retrained.py"
      - "tests/test_train_kitty_v3_retrained.py"
      - ".github/workflows/kitty-v3-training-experiments.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install experiment dependencies
        run: python -m pip install --upgrade pip numpy pandas scikit-learn torch
      - name: Run Kitty experiment contract tests
        run: python -m unittest discover -s tests -p 'test_train_kitty_v3_retrained.py' -v
      - name: Compile training script
        run: python -m py_compile train_kitty_v3_retrained.py
