name: Kitty realistic backtest tests

on:
  pull_request:
    paths:
      - "kitty_realistic_backtest.py"
      - "tests/test_kitty_realistic_backtest.py"
      - ".github/workflows/kitty-realistic-backtest.yml"
  push:
    branches: [main]
    paths:
      - "kitty_realistic_backtest.py"
      - "tests/test_kitty_realistic_backtest.py"
      - ".github/workflows/kitty-realistic-backtest.yml"

permissions:
  contents: read

jobs:
  realistic-backtest-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip numpy pandas
      - run: python -m unittest discover -s tests -p 'test_kitty_realistic_backtest.py' -v
