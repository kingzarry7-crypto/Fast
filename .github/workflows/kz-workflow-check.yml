name: KZ Workflow Engine Check

on:
  push:
    paths:
      - "workflow_*.py"
      - "web_research_engine.py"
      - "test_web_research_engine.py"
      - "workflow_api.py"
      - "workflow_scheduler.py"
      - "reliability_guardian.py"
      - "learning_loop.py"
      - "revenue_engine.py"
      - "api.py"
      - "test_workflow_engine.py"
      - "work_intent.py"
      - "test_work_intent.py"
      - "channel_work.py"
      - "bot.py"
      - "discord_bot.py"
      - "browser_*.py"
      - "connector_api.py"
      - "job_outreach_agent.py"
      - "test_job_outreach_agent.py"
      - "test_browser_operator.py"
      - ".github/workflows/kz-workflow-check.yml"
      - "frontend/**"
  pull_request:
    paths:
      - "frontend/**"
      - "web_research_engine.py"
      - "test_web_research_engine.py"
      - "workflow_*.py"
      - "workflow_api.py"
      - "workflow_scheduler.py"
      - "reliability_guardian.py"
      - "learning_loop.py"
      - "revenue_engine.py"
      - "api.py"
      - "test_workflow_engine.py"
      - "work_intent.py"
      - "test_work_intent.py"
      - "channel_work.py"
      - "bot.py"
      - "discord_bot.py"
      - "connector_api.py"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile workflow modules
        run: python -m py_compile workflow_models.py workflow_store.py workflow_engine.py workflow_api.py workflow_scheduler.py reliability_guardian.py learning_loop.py revenue_engine.py channel_work.py work_intent.py api.py browser_operator.py browser_api.py connector_api.py job_outreach_agent.py test_browser_operator.py test_job_outreach_agent.py test_workflow_engine.py bot.py discord_bot.py web_research_engine.py test_web_research_engine.py
      - name: Run workflow tests with coverage
        run: |
          python -m pip install --disable-pip-version-check coverage requests
          coverage run -m unittest test_workflow_engine.py test_work_intent.py test_delivery_agent.py test_business_dashboard.py test_workflow_scheduler.py test_learning_loop.py test_reliability_guardian.py test_browser_operator.py test_job_outreach_agent.py test_web_research_engine.py
          coverage report -m
