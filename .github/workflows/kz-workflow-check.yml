name: KZ Workflow Engine Check

on:
  push:
    paths:
      - "account_agent.py"
      - "tests/test_legacy_railway_env_names.py"
      - "tests/test_sandbox_runner_app.py"
      - "account_notifications.py"
      - "gmail_intelligence.py"
      - "test_account_notifications.py"
      - "test_gmail_intelligence.py"
      - "workflow_*.py"
      - "engineering_executor.py"
      - "coding_request.py"
      - "isolated_code_runner.py"
      - "tests/test_engineering_executor.py"
      - "tests/test_isolated_code_runner.py"
      - "sandbox_runner/**"
      - "test_coding_request.py"
      - "ai_engine.py"
      - "email_draft_safety.py"
      - "test_email_draft_safety.py"
      - "google_connector.py"
      - "web_research_engine.py"
      - "test_web_research_engine.py"
      - "workflow_api.py"
      - "workflow_scheduler.py"
      - "reliability_guardian.py"
      - "learning_loop.py"
      - "revenue_engine.py"
      - "api.py"
      - "streaming_chat.py"
      - "test_streaming_chat_routing.py"
      - "config.py"
      - "test_provider_config.py"
      - "news.py"
      - "tests/test_free_news_fallback.py"
      - "agent_router.py"
      - "system_inventory.py"
      - "test_agent_router.py"
      - "test_workflow_engine.py"
      - "work_intent.py"
      - "test_work_intent.py"
      - "channel_work.py"
      - "bot.py"
      - "discord_bot.py"
      - "browser_*.py"
      - "connector_api.py"
      - "job_outreach_agent.py"
      - "test_job_outreach_agent.py"
      - "test_browser_operator.py"
      - ".github/workflows/kz-workflow-check.yml"
      - "frontend/**"

  pull_request:
    paths:
      - "tests/test_free_news_fallback.py"
      - "tests/test_legacy_railway_env_names.py"
      - "tests/test_sandbox_runner_app.py"
      - "news.py"
      - "config.py"
      - "test_provider_config.py"
      - "account_agent.py"
      - "account_notifications.py"
      - "gmail_intelligence.py"
      - "test_account_notifications.py"
      - "test_gmail_intelligence.py"
      - "frontend/**"
      - "web_research_engine.py"
      - "test_web_research_engine.py"
      - "workflow_*.py"
      - "engineering_executor.py"
      - "coding_request.py"
      - "isolated_code_runner.py"
      - "tests/test_engineering_executor.py"
      - "tests/test_isolated_code_runner.py"
      - "sandbox_runner/**"
      - "test_coding_request.py"
      - "ai_engine.py"
      - "email_draft_safety.py"
      - "test_email_draft_safety.py"
      - "google_connector.py"
      - "workflow_api.py"
      - "workflow_scheduler.py"
      - "reliability_guardian.py"
      - "learning_loop.py"
      - "revenue_engine.py"
      - "api.py"
      - "streaming_chat.py"
      - "test_streaming_chat_routing.py"
      - "agent_router.py"
      - "test_agent_router.py"
      - "test_workflow_engine.py"
      - "work_intent.py"
      - "test_work_intent.py"
      - "channel_work.py"
      - "bot.py"
      - "discord_bot.py"
      - "connector_api.py"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies from committed lockfile
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Verify Cloudflare OpenNext build
        run: npm run cf:build

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile workflow modules
        run: python -m py_compile config.py test_provider_config.py news.py tests/test_free_news_fallback.py tests/test_legacy_railway_env_names.py tests/test_sandbox_runner_app.py engineering_executor.py coding_request.py isolated_code_runner.py sandbox_runner/app.py ai_engine.py email_draft_safety.py google_connector.py account_agent.py test_email_draft_safety.py workflow_models.py workflow_store.py workflow_engine.py workflow_api.py workflow_scheduler.py reliability_guardian.py learning_loop.py revenue_engine.py channel_work.py work_intent.py api.py streaming_chat.py agent_router.py system_inventory.py test_agent_router.py test_streaming_chat_routing.py browser_operator.py browser_api.py connector_api.py job_outreach_agent.py test_browser_operator.py test_job_outreach_agent.py test_workflow_engine.py bot.py discord_bot.py web_research_engine.py test_web_research_engine.py
      - name: Run workflow tests with coverage
        run: |
          python -m pip install --disable-pip-version-check coverage requests fastapi
          coverage run -m unittest test_provider_config.py tests/test_free_news_fallback.py tests/test_legacy_railway_env_names.py tests/test_sandbox_runner_app.py test_coding_request.py tests/test_engineering_executor.py tests/test_isolated_code_runner.py test_email_draft_safety.py test_workflow_engine.py test_agent_router.py test_work_intent.py test_delivery_agent.py test_business_dashboard.py test_workflow_scheduler.py test_learning_loop.py test_reliability_guardian.py test_browser_operator.py test_job_outreach_agent.py test_web_research_engine.py test_streaming_chat_context.py test_streaming_chat_routing.py
          coverage report -m
