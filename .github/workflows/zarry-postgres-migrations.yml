name: ZARRY PostgreSQL migration and budget contracts

on:
  pull_request:
    paths:
      - "zarry_gateway/**"
      - "scripts/apply_zarry_migrations.py"
      - "tests/test_zarry_gateway_postgres_migrations.py"
      - "tests/test_zarry_gateway_budget_postgres.py"
      - ".github/workflows/zarry-postgres-migrations.yml"

jobs:
  postgres-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zarry_test
          POSTGRES_PASSWORD: zarry_test
          POSTGRES_DB: zarry_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zarry_test -d zarry_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ZARRY_TEST_DATABASE_URL: postgresql://zarry_test:zarry_test@localhost:5432/zarry_migration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL test driver
        run: python -m pip install "psycopg2-binary==2.9.10" "fastapi>=0.110,<1"
      - name: Compile guarded migration runner
        run: python -m py_compile scripts/apply_zarry_migrations.py
      - name: Apply migrations twice and verify idempotency and constraints
        run: python tests/test_zarry_gateway_postgres_migrations.py
      - name: Verify real PostgreSQL budget concurrency and settlement
        run: python tests/test_zarry_gateway_budget_postgres.py
