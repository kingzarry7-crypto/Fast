name: king-zarry-base44

services:
  db:
    image: postgres:16
    restart: on-failure
    environment:
      - POSTGRES_USER=kingzarry
      - POSTGRES_PASSWORD=kingzarry_dev_pw
      - POSTGRES_DB=kingzarry
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./web_database.sql:/docker-entrypoint-initdb.d/01_web_database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kingzarry -d kingzarry"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.base44-api
    restart: on-failure
    working_dir: /app
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/app
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - DATABASE_URL=postgresql://kingzarry:kingzarry_dev_pw@db:5432/kingzarry
      - FRONTEND_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 5 http://localhost:8000/health >/dev/null || (echo 'api /health failed'; exit 1)"]
      interval: 15s
      timeout: 8s
      start_period: 60s
      retries: 5

  web:
    image: node:22
    restart: on-failure
    working_dir: /app
    command: sh -c "npm install && npx next dev -H 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    environment:
      - NEXT_PUBLIC_API_BASE_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - API_PROXY_TARGET=http://api:8000
      - BASE44_PUBLIC_HOST_SUFFIX
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>{console.log('web frontend failed');process.exit(1)})\""]
      interval: 20s
      timeout: 10s
      start_period: 180s
      retries: 5

volumes:
  pgdata:
  web_node_modules:
